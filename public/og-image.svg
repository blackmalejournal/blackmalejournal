<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0C0B"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#C0281F"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="6" fill="#C0281F"/>

  <!-- Star — centered at (600, 245), outer R=80, inner r=33 -->
  <polygon
    points="600,165 619,218 676,220 631,255 647,310 600,278 553,310 569,255 524,220 581,218"
    fill="#C0281F"
  />

  <!-- Publication name -->
  <text
    x="600" y="380"
    text-anchor="middle"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-size="72"
    letter-spacing="8"
    fill="#F2EDE4"
  >THE BLACK MALE JOURNAL</text>

  <!-- Tagline -->
  <text
    x="600" y="438"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    letter-spacing="3"
    fill="#B8986A"
  >INDEPENDENT MEDIA FOR BLACK MEN</text>

  <!-- Three lenses -->
  <text
    x="600" y="485"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    letter-spacing="5"
    fill="#B8986A"
    opacity="0.7"
  >HEALTH · PHILOSOPHY · POLITICS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0C0B"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#C0281F"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="6" fill="#C0281F"/>

  <!-- Brand mark watermark — star + pen nib, low opacity -->
  <g opacity="0.08" transform="translate(510, 100)">
    <!-- Pen nib -->
    <path d="M90 0 C81 27 68.4 36 63 50.4 L90 39.6 L117 50.4 C111.6 36 99 27 90 0Z" fill="#712414"/>
    <circle cx="90" cy="32.4" r="5.4" fill="#F2EDE4"/>
    <!-- Star body -->
    <path d="M90 50.4 L109.8 104.4 L171 104.4 L120.6 133.2 L140.4 180 L90 158.4 L39.6 180 L59.4 133.2 L9 104.4 L70.2 104.4 Z" fill="#712414"/>
  </g>

  <!-- Publication name -->
  <text
    x="600" y="380"
    text-anchor="middle"
    font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
    font-size="72"
    letter-spacing="8"
    fill="#F2EDE4"
  >THE BLACK MALE JOURNAL</text>

  <!-- Tagline -->
  <text
    x="600" y="438"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    letter-spacing="4"
    fill="#B8986A"
  >SPEAK THE TRUTH. NAVIGATE THE CONSEQUENCES.</text>

  <!-- Three lenses -->
  <text
    x="600" y="485"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    letter-spacing="5"
    fill="#B8986A"
    opacity="0.7"
  >HEALTH · PHILOSOPHY · POLITICS</text>
</svg>

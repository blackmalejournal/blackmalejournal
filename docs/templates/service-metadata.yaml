# Service / repository metadata — align field names with your internal service catalog schema.
# This file is a starter; validate against org JSON Schema in CI when available.

apiVersion: repo-governance/v1
kind: ServiceMetadata

metadata:
  name: {{kebab-case-service-name}}
  displayName: {{Human Readable Name}}
  description: >
    {{One paragraph: purpose and primary users.}}

  lifecycle: production # production | development | prototype | deprecated | archived

  repository: https://github.com/{{org}}/{{repo}}

  labels:
    team: {{team-slug}}
    domain: {{payments|identity|content|...}}
    tier: "1" # 0=critical ... 3=low

ownership:
  team: {{Team Name}}
  slackChannel: "{{#channel-name}}"
  email: {{team-list@company.com}}
  pagerDutyServiceId: "{{OPTIONAL_ID}}"
  escalation:
    primary: "{{@handle or rotation id}}"
    secondary: "{{@handle}}"

security:
  dataClassification: internal # public | internal | confidential | restricted
  pciScope: false
  hipaaScope: false
  customerPii: false

operations:
  onCall:
    type: rotation # rotation | business-hours | none
    scheduleUrl: "{{LINK}}"
  dashboards:
    - "{{GRAFANA_OR_SIMILAR_URL}}"
  runbooks:
    - "docs/runbooks/{{service}}-operations.md"

dependencies:
  criticalUpstream:
    - name: {{dependency-service}}
      contract: openapi # openapi | grpc | event | none
  criticalDownstream:
    - name: {{consumer-team-or-service}}

compliance:
  soc2Relevant: true
  lastReviewed: "{{YYYY-MM-DD}}"

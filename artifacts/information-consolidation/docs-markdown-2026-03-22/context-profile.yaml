context_name: "bmj_docs_markdown_consolidation"
version: "1.0"

entity_types:
  - document
  - event

source_trust_weights:
  filesystem_docs: 0.9

field_priorities:
  document:
    - name
    - summary
    - tags
  event:
    - name
    - summary
    - tags

normalization:
  date_format: "iso8601-utc"
  text_case: "preserve"
  enum_aliases:
    high: P1
    medium: P2
    low: P3

redundancy:
  hard_match_threshold: 0.97
  review_match_threshold: 0.84
  similarity_weights:
    lexical: 0.35
    semantic: 0.4
    key_fields: 0.2
    temporal: 0.05

merge_policy:
  prefer_newer_if_tie: true
  require_min_confidence: 0.6
  conflict_mode: "review_queue"
  trusted_sources_override: true

validation:
  required_fields_by_type:
    document: [id, name]
    event: [id, name]
  referential_integrity: true
  quarantine_on_schema_error: true

quality_thresholds:
  min_completeness: 0.9
  min_validity: 0.95
  max_unresolved_conflicts_per_1000: 10

output:
  format: "jsonl"
  include_lineage: true
  include_quality_metrics: true
